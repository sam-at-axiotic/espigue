narrative: |-
  ## Introduction

  A fundamental paradox haunts the design of multi-agent systems: adding shared memory should improve robustness and coordination. Yet **memory's sign on coordination speed is topology-dependent** [T1] — the same memory depth that accelerates consensus in centralized networks can slow it in decentralized ones, and apparent acceleration often masks settling into fragmented suboptimal states rather than achieving system-wide agreement. This contradiction is not a quirk of one protocol or dataset; it appears across memory-based opinion dynamics, multi-agent reinforcement learning, and large language model debate frameworks. It is the core obstacle that makes this review necessary.

  The urgency is practical. Deployed multi-agent LLM systems face an immediate design decision: whether to add memory to each agent's state (which theory suggests improves robustness (Wang et al., 2025)), and how to structure communication — centralized for speed, decentralized for robustness, or somewhere between. Yet the evidence does not provide a clean answer. Instead, it reveals that memory and topology are coupled in ways that create irreducible trade-offs between consensus speed and solution quality (Mehdizadeh & Hilbert, 2026). When designers tune one parameter, the other responds in unexpected ways depending on network structure. The same parameter—memory depth—pushes the system in opposite directions depending on communication topology, meaning no general rule can tell practitioners whether to add memory without first specifying topology. Yet current work often treats these choices as independent, leaving practitioners in a bind.

  This review organizes the evidence not as a linear narrative but as a **problem-lattice**: a set of interlocking open problems, each with evidence pulling in multiple directions. The lattice has five cells: (1) memory's topology-dependent effects and the speed–unity trade-off; (2) the cost of broadcast communication and the case for adaptive sparsification; (3) coordination via dual variable coordination instead of direct state consensus; (4) explicit goal-based consensus versus implicit training-time coordination; (5) the real bottlenecks in multi-agent LLM inference — iteration cadence and KV cache occupancy, not token count. These problems do not resolve into a single story or deterministic partition of the field. Rather, solving one often shifts constraints elsewhere, requiring interdisciplinary re-optimization.

  **The focal question** is: Under what conditions do memory and topology co-design choices improve both consensus speed and solution quality in multi-agent LLM systems, and when do they trade off irreducibly? (Wang et al., 2025; Mehdizadeh & Hilbert, 2026)

  **Scope**: This review covers agent–agent coordination in deployed multi-agent systems, focusing on the control parameters (memory depth, topology, consensus mechanism) that determine whether agents reach agreement and how quickly. Out of scope are single-agent LLM memory and state management (retrieval-augmented generation, long-context retrieval, KV cache optimization for individual models); general consensus algorithms in distributed systems outside the multi-agent coordination context; fine-tuning and training procedures for multi-agent LLMs; mechanisms for external persistent storage and database consistency; and human-in-the-loop oversight and human–AI coordination. The scope is in-flight coordination during reasoning among autonomous agents during deployment, not model learning or external persistence.

  ## Memory's contradictory topology dependence and hidden fragmentation penalty

  The foundation of this review rests on a central contradiction. Linear memory-based consensus protocols — which incorporate agents' previous and current states via a weighted combination — admit a necessary and sufficient consensus condition, with the robustness gain determined solely by control parameters and the nonzero minimum and maximum Laplacian eigenvalues (Wang et al., 2025). This is clean, classical theory: tuning the memory coefficient improves both robustness and scalability, and the two are positively correlated. Under this model, more memory is better — it reduces sensitivity to perturbations while enabling larger systems to coordinate with the same communication overhead.

  Yet empirical observation contradicts the universality of this conclusion. **Memory depth and network topology interact so that longer memory accelerates consensus speed in centralized topologies but slows it in decentralized ones** (Mehdizadeh & Hilbert, 2026). The same parameter pushes the system in opposite directions depending on structure. In a centralized topology — where one agent or hub receives information from all others — adding memory to the update rule allows the central agent to anchor the system, pulling others toward its state more rapidly. In a decentralized topology, where no single agent is privileged, adding memory to every agent's update rule causes each to trust its own history as heavily as incoming information, slowing the propagation of new knowledge through the topology and delaying collective consensus speed.

  This empirical finding immediately suggests a deeper problem. In centralized topologies, **the apparent acceleration of consensus speed with more memory masks locking into a fragmented plateau rather than reaching system-wide consensus** (Mehdizadeh & Hilbert, 2026). The central agent converges quickly, pulling nearby agents, but outlying agents in the topology do not receive the corrective information fast enough; they settle into a state that differs from the center, and the system stabilizes into fragments. The robustness gain in theory — lower ℓ₂ distance to a desired state — becomes a liability in practice: agents are more stable around their local fragmented consensus than they are responsive to slow-arriving signals that would correct them toward global agreement. The agents reach a state where they stop moving and believe they have converged, but the system has actually fragmented into competing conventions, each internally reinforced through shared memory.

  This is the crux of the first cell in the problem-lattice: the theoretical prediction from (Wang et al., 2025) (memory improves robustness and scalability uniformly) does not survive empirical contact with realistic topologies. The reason is mechanistic. In a centralized topology, memory weight is applied to each agent's history, but the history of central agents is correlated with global information (because they see everyone), while the history of peripheral agents contains only local, stale information. By weighting history heavily, peripheral agents trust stale signals and ignore fresh incoming data. They lock into their locally reinforced state. Conversely, in decentralized topologies, memory slows consensus speed because all agents are peripheral; all are trusting local history that is out of sync with the rest. The topology dependence reveals that (Wang et al., 2025)'s robustness gain may hold only in a regime where solution quality — whether consensus is truly global or merely fragmented — is not yet measured.

  The implication is stark: **memory's sign on consensus speed is topology-dependent**. There is no universal parameter choice. Adding memory does not generically accelerate consensus speed; its effect depends entirely on where agents sit in the topology, and that dependence masks a speed–unity trade-off: centralized topologies appear faster only because they settle into fragments faster. This rules out any protocol that assumes fixed memory coefficients across all network structures and reveals that consensus protocols robust in (Wang et al., 2025)'s sense may be solving the wrong problem. Accelerating consensus speed toward a fragmented state is not the same as accelerating consensus speed toward global solution quality. The tension between (Wang et al., 2025), (Mehdizadeh & Hilbert, 2026), and (Mehdizadeh & Hilbert, 2026) is not a refinement; it is a boundary between success and failure, and it exposes why co-design of memory depth and topology is necessary: neither parameter can be tuned independently without risking either slow convergence or fast fragmentation.

  ## The speed–unity trade-off and co-design imperative

  The contradiction between (Wang et al., 2025) and (Mehdizadeh & Hilbert, 2026) is not incidental—it reflects a deeper trade-off that pervades multi-agent coordination. Building on the empirical observation that memory and topology interact, evidence now suggests that **a memory-mediated speed–unity trade-off holds: memory depth and communication topology should be co-designed rather than optimized independently** (Mehdizadeh & Hilbert, 2026).

  Unpack this claim mechanistically. In a centralized topology with moderate to high memory depth, consensus appears to be reached quickly—the center converges, and agents nearby follow. But this appearance deceives. Agents do not converge to a single value; instead, they settle into clusters, with the central agent(s) at one state and peripheral agents at a different state. Consensus is illusory; fragmentation is real. The "speed" is the time to reach fragmented equilibrium, not system-wide agreement.

  Why does this happen? In a centralized topology, the central agent is the first to stabilize; it receives all information and has low uncertainty. Its state becomes a strong attractor in the update rules of nearby agents. But because agents weight their own history—due to memory depth—they do not immediately adopt the central state. Instead, they move toward it slowly, converging on a value between their previous position and the center's state. The farther an agent sits from the center, the more slowly it receives updated information, and the more its memory depth causes it to lag behind. The system then locks in: the center has stabilized, nearby agents have partially converged to a compromise between the center and their own history, and far agents remain at even older consensus points. Longer memory preserves more competing conventions in centralized topologies because each agent's trajectory is anchored firmly to its past, and memory coefficients prevent rapid correction even when new signals arrive (Mehdizadeh & Hilbert, 2026). Reducing memory depth would accelerate global convergence but sacrifice the robustness that memory depth provides near the center; increasing memory depth would entrench fragmentation.

  In decentralized topologies, the trade-off inverts. Agents are symmetric, so memory depth does not create structural bias in information flow. Instead, memory depth slows consensus speed because every agent is "far" from the rest—none has privileged information. High memory depth means that each agent trusts its own history as much as (or more than) incoming messages, so new information propagates slowly through the network. The consensus that eventually emerges is robust, but reaching it takes many rounds. Reducing memory depth would accelerate convergence but increase susceptibility to noise.

  The term "speed–unity trade-off" captures this: faster consensus speed to a consensus point can be purchased only at the cost of settling into a fragmented or suboptimal state rather than achieving system-wide agreement. The two goals—fast consensus and correct consensus—are not independently tunable. They are coupled by memory depth and topology. Locally clustered agents coordinate better (Mehdizadeh & Hilbert, 2026) because all members see each other frequently and reinforce a shared trajectory, whereas agents at high-betweenness bridges connecting distant clusters suffer a brokerage penalty, forced to reconcile competing conventions simultaneously while memory depth amplifies this burden by forcing the bridge to carry historical weight from both sides.

  **Memory depth and communication topology should be co-designed rather than optimized independently** (Mehdizadeh & Hilbert, 2026). This is not a recommendation; it is a necessity. Separately tuning memory depth for robustness gain and topology for consensus speed will fail because changing one immediately shifts the constraints on the other. A network designer cannot choose a centralized topology for speed and a universal memory-depth coefficient for robustness gain; the choice of topology determines what memory depth is appropriate, and vice versa. Co-design means solving a joint optimization problem: finding pairs (memory depth, topology) that satisfy both consensus speed and solution quality constraints simultaneously. A designer choosing a centralized topology must either avoid memory depth or accept fragmentation as the outcome. A designer choosing a decentralized topology must either accept slower consensus speed or add memory depth selectively to clusters, avoiding the global dampening that hurts diffusion-based consensus.

  Current work offers no algorithm for such co-design under realistic constraints—where communication bandwidth is limited or topology is partially fixed by physical or organizational structure. This is a major gap. For deployed multi-agent LLM systems, it means that the default choice—apply the same memory depth and message strategy to all agents regardless of their position in the topology—is provably suboptimal and likely to produce fragmented false consensus. The payoff of "memory's sign on coordination speed is topology-dependent" is now clear: the topology dependence is not a minor complication but the core insight. Because memory's sign flips with topology, and because topology determines whether agents lock into fragments or reach system-wide agreement, memory depth and topology cannot be tuned separately. They must be co-designed. Failing to co-design means risking either slow fragmentation or slow global convergence. The speed–unity trade-off is irreducible given current coordination mechanisms; it cannot be engineered away. It can only be navigated by recognizing this dependence and choosing co-designs that accept the trade-off explicitly rather than hoping to optimize both dimensions simultaneously.

  ## Broadcast communication costs and the sparse alternative

  The speed–unity trade-off and memory–topology coupling arise within a given communication protocol. But the protocol itself—how agents decide what information to send and receive—is a choice variable, and choices here create a second major problem in the lattice.

  In multi-agent LLM systems, particularly frameworks for debate or collaborative reasoning, a natural baseline is **broadcast communication**: every agent sends its current state or reasoning to every other agent at each time step. This ensures that every agent has access to all information and can make the best decision given global knowledge. The problem is cost. **In multi-agent LLM workloads, message count, token cost, and latency grow approximately quadratically with agent count** (Gou & Liu, 2026).

  Why quadratic? In a system with $n$ agents, full-connectivity communication produces $n(n-1)$ directed message pairs per time step. Each message carries reasoning tokens, context, or state embeddings. If average message size scales with the complexity of collective reasoning, total token cost becomes $O(n^2)$ per round. For $n=10$ agents, this is manageable; for $n=100$ agents reasoning over multiple rounds, token cost becomes prohibitive. For $n=1,000$ agents, the cost moves into the millions of tokens per consensus round. Latency similarly scales: if messages must be serialized or if downstream processing depends on all messages arriving, then $n$ agents produce $O(n^2)$ dependencies, and latency compounds. This is not a minor efficiency problem but a hard ceiling on system size when inference is the scarce resource and latency must stay within a budget.

  This creates a fundamental tension. Broadcast preserves correctness—under full connectivity, consensus protocols enjoy the strongest guarantees (Wang et al., 2025). Every agent has current information from every other agent, enabling dynamic response to new evidence or reasoning breakthroughs. But broadcast is wasteful. Many of the $n^2$ messages carry redundant or low-value information. An agent that has already converged to the correct answer sends messages that do not change anyone's state. An agent uncertain sends its uncertainty to agents already confident, creating noise.

  The alternative is fixed sparse topology: restrict agents to send messages only to a fixed subset of neighbors (e.g., a ring, a tree, or a random regular graph). This reduces cost to $O(kn)$ where $k$ is the degree (fixed), and latency is no longer quadratic. But fixed sparsity loses adaptability. If one agent realizes an error and has valuable information to broadcast, the fixed topology may not route that information efficiently to all agents who need it. An agent several hops away on the topology from critical knowledge must consume latencies and tokens for many intermediate message hops. Conversely, some agents may repeatedly receive low-value messages from the same neighbors in a fixed topology, wasting slots in the message budget. Under fixed sparsity, some communications are high-value (an agent on the verge of a critical error needs urgent input from a reliable colleague), while others are low-value (two agents already in strong agreement need not repeat their exchange). The topology cannot distinguish these cases and either preserves low-value interactions or loses critical error-correction information.

  Neither option is fully satisfactory. Broadcast is correct but costly; fixed sparsity is efficient but brittle and rigid, unable to route messages to where they matter most. The evidence shows both approaches in use, but no principled method exists for choosing between them or combining them dynamically in theory or practice. This is the second cell of the lattice: communication cost versus adaptability, with no known simultaneous solution. The gap between these endpoints is the space where solutions must live: protocols that reduce cost while maintaining adaptability. Current work offers no algorithm that solves both constraints simultaneously under realistic deployment constraints where bandwidth is limited or topology is partially fixed by physical or organizational structure.

  ## Dynamic sparse consensus as adaptive solution

  Emerging evidence suggests a potential path through the cost–adaptability dilemma: **Dynamic Sparse Consensus (DySCo) replaces universal broadcast with on-demand communication by estimating edge value from agent reliability, answer divergence, and task relevance, selecting high-value edges under budget, aggregating via dynamic trust weights, and terminating early once consensus stabilizes** (Gou & Liu, 2026).

  The mechanism operates as follows. Instead of broadcasting universally or committing to a fixed topology, each agent (or a central coordinator) estimates the value of each potential message before sending it. The value combines three signals: (1) **agent reliability**, a measure of whether this agent's previous outputs have been correct or consistent with verified information; (2) **answer divergence**, whether this agent's current state or reasoning differs from the current consensus or from other agents; (3) **task relevance**, whether this agent's information is germane to the current reasoning step. High-value edges—those between a reliable agent with divergent information and uncertain agents facing a relevant subtask—are prioritized. Low-value edges—between two agents already in agreement, or from an unreliable agent, or on an irrelevant subtask—are skipped. Edges are selected under a communication budget (e.g., each agent sends at most K messages per round).

  Aggregation is adaptive: agents do not weight all incoming messages equally. Instead, they use dynamic trust weights, assigning higher credibility to agents with high reliability scores and lower weights to agents whose recent messages have been noisy or incorrect. Crucially, the protocol terminates early once a stability criterion is met—e.g., all agents have converged to the same answer, or sufficient confidence has been reached that further communication will not change decisions.

  This approach directly addresses the cost–adaptability tension. By selecting high-value edges, DySCo reduces message count and token cost compared to broadcast—not to O(kn), but to something intermediate that depends on task structure and agent disagreement. **Message count, token cost, and latency grow approximately quadratically with agent count in broadcast (Gou & Liu, 2026), but under DySCo, growth is bounded by the communication budget K, which is a design choice independent of agent count.** Unlike fixed-topology sparse protocols, DySCo adapts: if an agent discovers an error, it becomes high-divergence and high-value, so its messages are prioritized. If an agent's information becomes irrelevant (task changes or prior reasoning is finalized), it becomes low-value, so its messages are suppressed. The protocol preserves correctness by routing error-correcting information preferentially; it preserves efficiency by suppressing redundant communication.

  The evidence for DySCo is emerging and single-source (Gou & Liu, 2026). It is presented as a theoretical protocol with some validation on synthetic reasoning tasks, but it has not been independently replicated, nor has it been tested against other adaptive sparsification schemes or on realistic multi-agent LLM workloads. Whether DySCo achieves subquadratic cost in practice remains an open empirical question, dependent on the distribution of task-relevant divergence across workloads. More critically, it is unclear how DySCo interacts with shared memory depth and topology co-design (Mehdizadeh & Hilbert, 2026). If agents use shared memory, does the reliability estimate account for memory-driven bias toward older states? If the topology is partially fixed by physical or organizational structure, does DySCo operate at multiple scales? If an agent increases its shared memory depth to improve local stability, should edge value calculations adapt accordingly? The decision to terminate early is also heuristic-based (lack of state change) rather than principled (all necessary information has propagated), raising the risk of premature consensus. Nevertheless, DySCo represents a structurally novel approach: it makes communication protocol adaptive to both task state and agent knowledge, rather than static. If the mechanism can be validated at scale and composed with shared memory and topology co-design, it could resolve the cost–adaptability tension.

  ## Coordination via dual variables and linear scaling

  The first two cells of the lattice frame coordination as reaching consensus on agents' states or opinions. But consensus on states is not the only coordination mechanism. An alternative approach bypasses the need for agents to agree on their answers directly. Instead, **agents coordinate through consensus on a shared dual variable (Lagrange multiplier) rather than on rewards, enabling linear scaling to hundreds or thousands of agents under separable dynamics, and outperforms fixed-multiplier baselines (MAPPO, MADDPG, MASAC, ISAC) that violate constraints despite exhaustive hand-tuning** (Amaya-Corredor et al., 2026).

  This is a fundamentally different coordination primitive. Instead of asking "what is the right answer or state?", agents ask "what is the price of violating a constraint?" Each agent optimizes its local objective subject to constraints, using the Lagrange multiplier as the price for constraint violation. Agents then communicate the Lagrange multiplier — a scalar or low-dimensional vector — rather than their full state. Because multipliers are compact, communication overhead scales linearly with agent count, not quadratically. Each agent can optimize independently using its local multiplier estimate, then all agents converge on the true multiplier through consensus.

  The theoretical result is striking: standard multi-agent RL baselines (MAPPO, MADDPG, MASAC, and ISAC) fail to enforce constraints even with extensive hand-tuning, settling into states where constraints are violated. This failure is not a tuning problem but a design problem — these methods coordinate on the wrong variable. Dual-variable coordination enforces constraints exactly while scaling linearly, not quadratically, in both communication and computation. The scaling advantage is decisive: total communication cost is O(n) per round (each agent broadcasts one multiplier value), whereas methods coordinating on actions or rewards require O(n²) messaging or suffer quadratic blowup in convergence time.

  However, the mechanism requires a crucial augmentation: **agents must locally track their own Lagrange multipliers to distinguish genuine feasible constraint satisfaction from trivial constraint satisfaction achieved by indefinitely postponing demand** (Amaya-Corredor et al., 2026). Without this augmentation, agents can appear to satisfy constraints globally while actually delaying indefinitely. For example, if the constraint is "all agents must meet a deadline," agents could satisfy this by never acting (postponing demand entirely). Adding the dual variable to each agent's state makes such deception apparent: the multiplier would remain high (indicating unmet demand), and other agents would adjust their behavior in response. By including the dual variable in the state, agents see the price signal directly and learn to balance satisfaction against cost. This is a design requirement that is not obvious from theory alone and reveals that dual-variable coordination is not fully implicit; agents must expose and track their local dual variables, making the coordination mechanism explicit and observable.

  The evidence for dual-variable coordination is single-source (Amaya-Corredor et al., 2026). It comes from multi-agent reinforcement learning with separable dynamics, where each agent's reward and constraints depend only on its own actions and a global multiplier, not on other agents' actions directly. It is unknown whether this approach scales beyond separable RL to coupled multi-agent settings — for instance, where agents' rewards interact directly, as in debate or negotiation. For multi-agent LLM coordination, the applicability gap is substantial: it is unclear whether agents can be naturally modeled as satisfying constraints (e.g., "generate coherent reasoning" or "flag contradictions"), whether their reasoning decomposes into separable subproblems, and how agents should embed and update Lagrange multipliers in language-based reasoning without explicit numerical state. Nevertheless, dual-variable coordination introduces a principled alternative to the memory–topology trade-off: instead of tuning topology and memory depth to balance consensus speed and solution quality, make the coordinating variable itself simpler and more natural (the constraint price) so that fewer bits need to be communicated and fewer parameters require tuning.

  ## Explicit goal-based consensus versus implicit training-time coordination

  A third coordination mechanism distinct from memory–topology trade-offs and dual-variable coordination emerges in the multi-agent LLM literature: explicit goal-based consensus. The central finding is that **in multi-agent LLM workloads structured as trees of dependent calls, explicit consensus can be constructed by generating an achievable, valuable future state as a shared goal (MAGI), which avoids multi-step rollout and outperforms CTDE and imagination baselines on sample efficiency and final performance across Multi-agent Particle-Environments tasks** (Wang et al., 2024).

  The tension here is between explicit and implicit coordination primitives. Centralized Training with Decentralized Execution (CTDE) is standard in multi-agent reinforcement learning: agents are trained together in a central setting with access to all information, but at deployment they execute independently with only local observations. The theory is that agents learn implicit coordination during training—they anticipate each other's behavior through the shared training signal. In practice, this often fails. At deployment, agents' local observations diverge, they make different decisions than during training, and the implicit coordination breaks down, causing the miscoordination that (Wang et al., 2024) targets.

  MAGI offers an explicit alternative. Instead of relying on implicit consensus learned during training, agents generate a concrete, achievable, valuable future state (a goal) that they all agree to work toward. This goal is explicit and shared, making coordination visible and debuggable. Agents then execute independently to reach the goal, knowing they are working toward the same target. The key advantage is that agents need not simulate future steps to coordinate; they only need to agree on a goal. This is more efficient than rollout-based methods that require agents to predict multiple steps ahead. The comparison to imagination baselines (where agents model every other agent's future trajectory) compounds the efficiency gain: MAGI avoids the exponential explosion of joint action spaces by providing the shared goal directly, so agents need only plan, not imagine.

  The empirical result demonstrates that MAGI avoids multi-step rollout and achieves higher sample efficiency and solution quality than CTDE and imagination baselines on the tested domains. The framework thus identifies explicit goal generation as a distinct coordination primitive, separate from state-consensus mechanisms with memory–topology trade-offs [C1–C4], dual-variable consensus for constraint satisfaction (Amaya-Corredor et al., 2026), or dynamic sparse communication (Gou & Liu, 2026).

  However, evidence for MAGI is single-source (Wang et al., 2024), and the benchmark is relatively simple—particle environments with clear spatial goals and simple dynamics, not complex reasoning tasks. It remains unknown how MAGI performs on LLM reasoning workloads, whether goals generated are interpretable and auditable by humans, how to set goals dynamically in response to task instances when earlier goals become infeasible, and how MAGI composes with other coordination mechanisms. For instance, can MAGI-generated goals serve as the objective in dual-variable coordination (Amaya-Corredor et al., 2026)? Can explicit goals be combined with adaptive shared memory (Wang et al., 2025; Mehdizadeh & Hilbert, 2026) to create a richer coordination state? Can explicit goal-based coordination scale when agents are LLMs with complex reasoning and high-dimensional state spaces? The applicability gap to multi-agent LLM reasoning is substantial: defining what constitutes an achievable and valuable intermediate consensus state in abstract reasoning tasks (e.g., multi-agent debate on open-ended questions) is unclear. These are open questions that section 5 will revisit.

  ## Resource bottlenecks in practice: KV cache, attention state, and iteration cadence

  Theory has focused on consensus speed measured in iteration count or message volume, implicitly assuming that each iteration carries uniform cost. Deployed multi-agent LLM systems structured as trees of dependent calls reveal a different constraint: **the binding bottleneck is not total token count but the cadence of short iterations, with the KV cache acting as a dynamic scarce resource and bottlenecks shifting from arithmetic throughput to memory, attention-state management, stopping discipline, and context engineering** (Verma, 2026).

  This empirical finding, grounded in measurement of actual tree-structured multi-agent LLM workloads, exposes a gap between theoretical optimization and implementation reality. Each iteration requires one or more forward passes through the LLM, accumulating key-value pairs in the KV cache. As the cache grows, memory bandwidth becomes saturated; arithmetic operations (attention matrix multiplications) are no longer the bottleneck—memory movement is. When multiple agents reason simultaneously on the same GPU or TPU cluster, their KV caches compete for bandwidth. The order of agent computation, synchronization timing, and context-growth rate all affect wall-clock system throughput. A consensus protocol that appears efficient in iteration count may be inefficient in wall-clock time because it creates cache contention patterns that stall memory access.

  Stopping discipline and context engineering emerge as first-order design concerns. Stopping too early sacrifices information; stopping too late wastes cache on low-value reasoning. How information is formatted and accumulated in the prompt affects cache efficiency. A protocol that compresses shared memory into short messages may reduce token count but force expensive re-computation of embeddings if the format does not compose well with the LLM's attention mechanism.

  This reframes the optimization landscape fundamentally. Consensus protocols optimized for low token count might require many iterations, each with high latency. Iteration latency—wall-clock time per iteration—becomes more relevant than token count. Memory depth in agent state vectors (shared memory from prior sections) might be negligible in cost, while memory (cache) in the LLM itself dominates. A protocol that requires agents to maintain long histories of prior states occupies cache; if memory depth grows, that history competes directly with task-relevant reasoning capacity. Similarly, topology choices that enable fine-grained consensus updates may worsen cache contention if they force frequent, rich state synchronization. The cache becomes a new constraint on memory depth and shared memory–topology co-design (Mehdizadeh & Hilbert, 2026).

  The evidence is single-source (Verma, 2026) and derives from empirical measurement of specific LLM deployments, not theoretical analysis. The binding constraint may vary across different LLM hardware, inference frameworks, and task structures. (Verma, 2026) does not provide ablations or quantify effect magnitudes in isolation. Yet it is the most directly relevant evidence to practitioners because it is rooted in actual system behavior, not simulation. Its claims about iteration cadence and cache occupancy should be weighted heavily as implementation hypotheses that require validation, not yet established facts. The implication is that future consensus protocols should jointly optimize for cache efficiency and consensus speed, not just message count—a design tension that theory has not yet incorporated systematically.

  ## Open questions and future directions

  The problem-lattice has five cells, each with evidence pulling in multiple directions and none yet fully resolved. Converting the unresolved tensions into a concrete research agenda reveals six interconnected gaps that theory and practice must jointly address.

  **Topology–memory co-design under real communication constraints** (extends (Mehdizadeh & Hilbert, 2026)): Current work assumes fixed communication topology and derives memory coefficients post-hoc. In practice, topology and memory must be jointly optimized under constraints: limited communication bandwidth, variable latency, or node availability that changes dynamically. The question is: under what constraints on bandwidth and latency does memory-depth and topology co-design become feasible, and what algorithms can solve the joint optimization? One direction is to parameterize the Laplacian eigenvalues (which determine robustness gain (Wang et al., 2025)) as functions of both topology structure and memory coefficients, then minimize a joint cost function (e.g., time-to-consensus + final state variance + communication overhead). Another direction is to use adaptive topology algorithms that update edge weights and connectivity based on current consensus error, combined with memory-depth adaptation. The current literature offers no algorithmic solution to this joint problem. Validation targets should include learning memory depth and adaptive topology using reinforcement learning or online convex optimization, measured on realistic task distributions at 50+ agents, with success defined as showing that joint optimization yields lower total cost than independent sequential optimization of memory depth and topology.

  **DySCo validation at scale and ablation** (extends (Gou & Liu, 2026)): Dynamic Sparse Consensus is presented as a theoretical protocol with promising results on synthetic tasks (Gou & Liu, 2026), but independent replication is absent. A first priority is to validate DySCo against baselines (full broadcast, fixed sparse topologies, random sparsification) on realistic multi-agent LLM reasoning tasks at scale (n ≥ 50 agents). Ablations should isolate the contributions of the three value signals (agent reliability, answer divergence, task relevance) and test whether simpler heuristics (e.g., random sparsification at a fixed edge density) achieve similar performance. A second priority is to characterize the subquadratic growth of message count and token cost more precisely: does DySCo achieve O(n log n) or O(n^1.5) or some other scaling, and how does this depend on task structure (tree depth, branching factor)? Specific gaps include measurement of whether early termination actually reduces latency, or whether the overhead of edge-value estimation and dynamic selection outweighs savings; sensitivity analysis to noise or adversarial corruption of reliability, divergence, and relevance signals; and interaction with the iteration-latency constraint (Verma, 2026)—whether DySCo's overhead shifts the binding constraint from iteration count to per-iteration latency. Success requires demonstrating that DySCo achieves task-level performance within ε of full-broadcast while using <50% of the communication cost, across at least three independent task domains.

  **Dual-variable coordination beyond separable dynamics** (extends (Amaya-Corredor et al., 2026)): Dual variable coordination shows impressive scaling in multi-agent RL with separable reward structure (Amaya-Corredor et al., 2026), but the question is whether this generalizes to coupled settings. In constrained multi-agent LLM reasoning, agents' outputs are coupled: one agent's reasoning constrains what others can validly say, and later reasoning steps depend on earlier ones. Can agents maintain local Lagrange multipliers that reflect shared constraints (e.g., "the reasoning must be logically consistent") without centralizing the constraint check? A second question follows from (Amaya-Corredor et al., 2026): how should agents expose and update their local dual variables in an LLM framework? Should these be part of the prompt, a separate state vector, or derived implicitly from likelihood scores? The mechanism for making dual variables explicit and observable is not yet designed for LLM agents. One hypothesis is that local dual variables must themselves coordinate, creating a hierarchical coordination structure. Another is that dynamic sparse consensus could identify which agent pairs are most tightly coupled and run dual-variable coordination only on those edges, leaving others to broadcast consensus. Validation requires extending dual-variable methods to coupled constraints and testing on realistic multi-agent tasks, with success measured by constraint satisfaction and scaling to 50+ agents without hand-tuning multipliers.

  **Explicit vs. implicit consensus composition** (extends (Wang et al., 2024)): MAGI shows that explicit goal generation outperforms implicit CTDE coordination on synthetic tasks. The open question is composability: can MAGI goals be used as targets within dual-variable coordination (Amaya-Corredor et al., 2026)? Can explicit goals be generated dynamically using memory-based updates (Wang et al., 2025; Mehdizadeh & Hilbert, 2026), enabling agents to shift goals as they reason? Can MAGI be combined with dynamic sparse communication (Gou & Liu, 2026) so that agents only exchange goal-revision messages when they disagree on the goal? These combinations would create richer coordination primitives. A unified framework would allow agents to have both a shared goal and a shared constraint multiplier; analysis is needed to determine whether these primitives interact adversarially (e.g., do agents optimize toward the goal while violating the constraint?). Testing should occur on tasks requiring both explicit coordination and constraint satisfaction, with success defined as the combined approach outperforming MAGI or dual-variable coordination alone.

  **Bridging cache pressure and consensus protocols** (extends (Verma, 2026)): The empirical finding that KV cache cadence is the binding constraint means that consensus protocols should be optimized for cache efficiency, not just iteration count. Theory-driven protocols must account for this. A first step is to measure cache contention patterns under different consensus update frequencies. Do frequent small consensus updates cause cache thrashing due to repeated context re-parsing, or is infrequent large consensus more wasteful because agents diverge further? A second step is to design stopping disciplines that account for cache occupancy: should agents stop reasoning earlier if cache pressure is high, trading solution quality for throughput? A third step is to integrate cache-aware metrics into the speed–unity trade-off (Mehdizadeh & Hilbert, 2026): the "consensus speed" in speed–unity trade-off should be measured in wall-clock time under cache pressure, not in theoretical iteration count. Should memory depth be adaptive based on cache occupancy, reducing memory depth when cache is full or reducing communication fan-out to lower cache pressure on neighbors? Should dynamic sparse consensus prioritize reducing cache footprint, not just message count? Success requires showing that cache-aware consensus uses <70% of the cache of cache-oblivious protocols while maintaining consensus speed and solution quality.

  **Unified metric for speed–unity trade-off** (extends (Mehdizadeh & Hilbert, 2026)): Current work uses proxy measures: iteration count for consensus speed, final state variance for solution quality. But these are not directly comparable or jointly optimizable. A unified metric would enable direct optimization of both goals and answer the practitioner's question: given a choice between Topology A (fast but fragmented) and Topology B (slow but globally coordinated), which is better? One candidate is Pareto frontier analysis: characterize the set of (memory depth, topology) pairs that are not dominated on both consensus speed and solution quality, then use domain knowledge to select among Pareto-optimal solutions. Another candidate is a weighted sum: speed–unity score = (iterations-to-consensus) + λ × (variance of final state), where λ is tuned to reflect the relative cost of being slow versus fragmented. A third candidate is threshold-based: ensure consensus speed below a latency threshold, then minimize fragmentation; or ensure solution quality above a threshold, then minimize consensus speed. A fourth candidate is time-to-quality, measuring wall-clock time to reach a given quality threshold (e.g., 99% agreement or constraint violation below ε). The choice of metric will be domain-dependent (LLM reasoning has different speed–unity trade-offs than distributed voting), so the future work is to establish domain-specific metrics, justify why they capture the speed–unity trade-off, show that optimizing these metrics yields different designs than optimizing consensus speed or solution quality independently, and validate that Pareto frontiers constructed using the metric align with practitioner preferences on real systems.

  ## Conclusion

  This review organizes the evidence on memory, topology, and coordination in multi-agent LLM systems as a **problem-lattice**: five interlocking open problems, each with evidence pulling in multiple directions. The structure reflects the corpus itself—emerging and single-source claims that do not yet cohere into a unified thesis or deterministic taxonomy.

  **Cell 1: Memory–topology interaction and speed–unity trade-off.** Linear memory improves robustness (Wang et al., 2025), but memory's effect on consensus speed depends entirely on topology (Mehdizadeh & Hilbert, 2026). In centralized networks, memory appears to accelerate consensus but actually masks locking into fragmented plateaus (Mehdizadeh & Hilbert, 2026). In decentralized networks, memory slows consensus. This creates an irreducible speed–unity trade-off: faster apparent convergence is purchased at the cost of false (fragmented) consensus. Co-design of memory and topology is necessary (Mehdizadeh & Hilbert, 2026), but algorithms and theory for co-design under realistic constraints are absent.

  **Cell 2: Communication cost and adaptability.** Full-connectivity broadcast in multi-agent LLM systems scales poorly—quadratic message and token cost (Gou & Liu, 2026)—but fixed sparse topologies lose adaptability and may fail to route error-correcting information. Dynamic Sparse Consensus (Gou & Liu, 2026) offers an adaptive alternative, selecting high-value edges based on agent reliability, divergence, and task relevance. Evidence is emerging and single-source; independent replication and scaling validation are priorities.

  **Cell 3: Constraint satisfaction via dual variables.** An orthogonal coordination mechanism reaches consensus on Lagrange multipliers (constraint prices) rather than on states (Amaya-Corredor et al., 2026), enabling linear scaling to hundreds of agents under separable dynamics. Agents must locally track dual variables to distinguish genuine constraint satisfaction from indefinite postponement (Amaya-Corredor et al., 2026). Applicability to coupled LLM reasoning and composability with other mechanisms remain open.

  **Cell 4: Explicit versus implicit coordination.** Explicit goal-based consensus (MAGI) generates a shared future state and outperforms implicit training-time coordination (CTDE) on sample efficiency and performance (Wang et al., 2024), avoiding multi-step rollout. Evidence is single-source on synthetic benchmarks. Composability with dual-variable coordination and other primitives is unexplored.

  **Cell 5: Real resource bottlenecks in deployed systems.** Theory optimizes for iteration count or token count, but deployed multi-agent LLM systems face a different bottleneck: KV cache cadence and memory bandwidth, not arithmetic throughput (Verma, 2026). Consensus protocols optimized for theoretical consensus speed may be suboptimal in wall-clock time. Evidence is single-source and requires broader measurement and validation.

  **Verdict on the framework.** The problem-lattice structure is appropriate because the evidence does not yet support a unified thesis. Memory and topology remain only partially characterized theoretically; consensus mechanisms are not yet composed or integrated with real resource constraints. Progress requires moving from single-source claims to convergent multi-lab validation and from isolated mechanisms to integrated frameworks. The lattice is not permanent; as evidence converges, cells will merge and the picture will sharpen.

  **Mapping to priority research directions.** First, replicate DySCo (Gou & Liu, 2026) and dual-variable coordination (Amaya-Corredor et al., 2026) independently on realistic benchmarks with n ≥ 50 agents, characterizing scalability curves and hyperparameter sensitivity. Second, measure actual resource constraints (cache occupancy, attention state management, iteration latency) in deployed multi-agent LLM systems, validating (Verma, 2026) across diverse workloads and architectures. Third, design co-optimization algorithms for memory depth and topology under bandwidth, latency, and cache constraints, solving the joint optimization problem hinted at in (Mehdizadeh & Hilbert, 2026). Fourth, develop a unified metric for the speed–unity trade-off, enabling direct optimization of both goals and comparison across protocols. Fifth, test composability of coordination primitives: can MAGI goals be used in dual-variable coordination? Can explicit goals adapt using memory-based updates? Can goal revision be done via dynamic sparse communication? Sixth, extend dual-variable coordination to coupled multi-agent LLM reasoning and develop methods for agents to locally track and expose dual variables within LLM frameworks. The problem-lattice will collapse into a more integrated framework as evidence converges. Until then, researchers must navigate the tensions explicitly, understanding that solving one cell may shift constraints in another.

