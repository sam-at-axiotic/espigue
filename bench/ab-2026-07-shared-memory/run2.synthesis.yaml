- description: The interaction between checkpoint-restore nondeterminism and exactly-once/idempotency guarantees has been demonstrated only in a single simulated MCP testbed; measuring duplicate rates in deployed durable-execution and streaming pipelines is collectable but undone [C10, C11].
  gap_type: empirical
- description: The field lacks an agreed instrument to certify that a recovery mechanism preserves correctness under nondeterministic callers — deterministic-caller assumptions underpin existing idempotency protocols, and no accepted method verifies replay-vs-fork correctness for LLM agents [C10, C12].
  gap_type: methodological
- description: There is no framework predicting when algebraic cache disaggregation (ForkKV) outperforms compression, tiering, or eviction under a given adapter-overlap and context-sharing profile; the layer-one losslessness boundary is proven but the general design frontier is not [C4, C5].
  gap_type: theoretical
