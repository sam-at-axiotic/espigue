gaps:
- description: No head-to-head evaluation of shared-, separate-, and hybrid-context memory architectures under identical task conditions and shared metrics exists; the studies could be run with existing methods but have not been [C4].
  gap_type: empirical
- description: The field lacks agreed instruments to measure long-horizon fidelity loss, leaving claims of hierarchical-memory superiority observational rather than measured [C5].
  gap_type: methodological
- description: No framework maps knowledge-state representation properties of LLM agents onto the Byzantine/crash/omission taxonomy of classical fault tolerance, so wrong-belief propagation cannot yet be predicted from agent internals [C9].
  gap_type: theoretical
