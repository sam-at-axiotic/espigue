- text: Selective summary-based synchronization shows promise but is validated on a single benchmark (Rodrigues, 2026).
  claim_refs:
  - C3
  expert_refs: []
- text: No head-to-head test under identical task conditions exists (Yuen et al., 2025; Parakhin, 2026; Jain et al., 2026).
  claim_refs:
  - C4
  expert_refs: []
- text: Hierarchical memory is claimed to support longer-horizon reasoning, but support is observational, not quantitative (Rezazadeh et al., 2025).
  claim_refs:
  - C5
  expert_refs: []
- text: Persistent memory creates information-integrity attack surfaces, and proposed governance regimes span a spectrum of security-scalability tradeoffs, but none is validated (Louck, 2026; Tan et al., 2026; Meier et al., 2026; Cuadros et al., 2026).
  claim_refs:
  - C6
  - C8
  expert_refs: []
- text: Memory-poisoning detection mechanisms are proposed without comparison to baselines (Tan et al., 2026; Meier et al., 2026).
  claim_refs:
  - C7
  expert_refs: []
- text: Byzantine failure modes in LLM agents are recognized as distinct from classical failures, and pilot experiments suggest Byzantine fault-tolerance frameworks are relevant (Zheng et al., 2025; Rodrigues, 2026), but the mapping from representation-level properties to Byzantine conditions remains uncharacterized.
  claim_refs:
  - C9
  expert_refs: []
- text: Classical multi-agent control theory offers rigorous solutions for consensus, event-triggered synchronization, and handling constrained and disturbance-prone agents (Nishida & Okano, 2026; Iqbal et al., 2022).
  claim_refs:
  - C10
  - C11
  expert_refs: []
- text: Context-adaptive memory compression improves resource efficiency under edge constraints (Mohammed et al., 2025), but the interaction between memory efficiency and synchronization protocol design is unexplored.
  claim_refs:
  - C13
