narrative: |-
  ## Introduction

  Multi-agent Large Language Model systems face a coordination failure distinct from the hallucination problems studied in single-agent settings. When multiple LLM agents reason jointly—drawing on shared context, prior decisions, or task state—they diverge in their internal representations of agreed-upon facts. This divergence produces contradictions that manifest as hallucination: agent statements that contradict shared understanding or ground truth (Rodrigues, 2026). The phenomenon is not simply model incapacity; it is a failure rooted in context drift. Yet the field lacks consensus on which synchronization protocols or memory architectures solve this problem without introducing new failure modes.

  This matters because deployed multi-agent LLM systems operate under hard resource constraints: limited GPU memory, communication bandwidth measured in API calls, inference latency measured in seconds, and security requirements that adversarial content should not persist into future sessions. Every synchronization protocol trades communication cost against fidelity. Every memory architecture—shared-context, separate-context, or hybrid—makes different bets about which coordination failures are acceptable (Yuen et al., 2025; Parakhin, 2026; Jain et al., 2026). Every governance regime for persistent memory either risks contamination or creates administrative overhead. There is no free solution. Practitioners cannot choose to avoid shared state (agents will otherwise diverge into incoherence), cannot rely on perfect synchronization (communication and latency budgets are fixed, hallucination propagates), and cannot defer the problem to single-agent reliability gains alone (in-context learning and decoding strategies do not eliminate coordination failures).

  The focal question animating this review is: under what conditions does shared state management in multi-agent LLM systems reduce hallucination and maintain coordination, and which memory architectures and synchronization protocols achieve this without creating new failure modes?

  The literature does not present a linear narrative of solved problems. Instead, it presents a lattice of interlocking open problems: context drift and synchronization tradeoffs; architectural incommensurability across incompatible benchmarks; emerging but weakly-supported claims about hierarchical memory, information-integrity attack surface concerns, and Byzantine failures; control-theoretic results from classical multi-agent systems whose transfer to LLM agents is postulated but not demonstrated. Shared-context, separate-context, and hybrid memory architectures each report improvements on non-overlapping evaluation suites with incommensurable metrics and no head-to-head test under identical task conditions (Yuen et al., 2025; Parakhin, 2026; Jain et al., 2026). Classical multi-agent control theory has solved distributed consensus and event-triggered synchronization for continuous systems with clear stability guarantees, yet their transfer to LLM agents remains asserted rather than empirically validated [T1]. The tensions between these claims are not resolved by evidence convergence but are instead revealed and sharpened by evidence gaps.

  Scope exclusions clarify the boundaries. This review does not address single-agent LLM hallucination reduction (in-context learning, decoding strategies, model scaling), general distributed-systems consensus theory decoupled from LLM applications, LLM interpretability or mechanistic explanation of reasoning steps, user-facing application design, fine-tuning and domain adaptation, or classical (non-LLM) multi-agent systems including reinforcement learning and symbolic planning.

  The review maps the field as a lattice—identifying which tensions are intra-cell and which span edges—to make visible which gaps are methodological (addressable by new controlled experiments) versus which are structural (requiring re-framing or integration across subfields). Each major section holds one tension or unresolved problem cell, showing the competing or complementary claims, the evidence supporting or undercutting each, and the specific gaps preventing resolution. The argument proceeds from core empirical findings and gaps—context drift as a distinct hallucination source, naive synchronization as a failure mode, selective protocols lacking breadth of validation, and memory architectures remaining incommensurable—through emerging frameworks (Byzantine failure modes, control-theoretic consensus, resource constraints) that offer conceptual tools but lack empirical instantiation in LLM settings, to a concrete research agenda converting unresolved tensions into testable hypotheses.

  ## Context drift as a coordination failure: hallucination distinct from model incapacity

  Hallucination in multi-agent LLM systems can arise independently of model incapacity. The conventional attribution—a learned representation that fails to generalize, or a decoding strategy assigning high probability to false continuations—does not account for failures originating in coordination rather than reasoning capacity. Context drift proposes a distinct causal mechanism: agents entering joint reasoning with mismatched or stale shared-state representations produce contradictions that neither agent would generate in isolation (Rodrigues, 2026). If Agent A and Agent B coordinate a travel plan and Agent A has not been updated that the destination flight was rebooked from 3 PM to 5 PM, Agent A will hallucinate connections and timings consistent with the outdated 3 PM departure. The hallucination is structurally sound given Agent A's knowledge state; the failure is not in model capacity but in coordination fidelity. This distinction matters because it reorients the problem: reducing this hallucination requires different levers than scaling or fine-tuning. The field has over-indexed on model-incapacity solutions; this review concerns the coordination-failure pathway.

  The obvious remedy—ensuring agents share identical knowledge state before joint reasoning—suggests full synchronization. Yet the simplest such solution worsens hallucination rather than improving it (Rodrigues, 2026). In travel-planning domains, naive full-broadcast synchronization—where one agent broadcasts its current state and others adopt it—increased hallucination rates from 0.492 (no synchronization baseline) to 0.658, a 34% absolute increase. The mechanism is contamination: when one agent holds erroneous beliefs and broadcasts them to all others, the error cascades, and agents construct false reasoning on top of the corrupted shared state. Broadcast synchronization propagates high-confidence hallucinations as readily as uncertain beliefs because a naive merge operation has no way to detect which agent's state is more reliable. This effect is task-dependent; it did not replicate in software-planning domains where no single shared belief cascades across evaluation dimensions, suggesting that synchronization protocol choice cannot be task-agnostic.

  The core tension crystallizes: agents must synchronize to prevent context drift, but synchronization itself can propagate error. This is not a defect of communication but a fundamental property of merging potentially inconsistent state representations. Between the extremes of "never synchronize" and "fully synchronize," selective summary-based protocols offer a provisional answer (Rodrigues, 2026). The Shared State Verification Protocol operates by having agents periodically exchange compressed summaries of key beliefs rather than full state, and flag high-divergence conditions before joint reasoning begins. This achieves significantly lower hallucination than full-broadcast while using 58% fewer API calls. The mechanism is filtering: by summarizing and flagging, the protocol creates an opportunity to detect and resolve inconsistencies before they cascade.

  The field does not yet know whether selective summary-based protocols generalize beyond the single benchmark and task class where they were measured, nor what happens when divergence detection itself fails or when agents are unaware they lack critical state. The evidence supports only one isolated point: selective summary-based exchange on one task class achieves lower hallucination and lower communication cost than full-broadcast. The tradeoff is that selective synchronization requires metadata about divergence—agents must recognize when their states have drifted—and this requirement remains unvalidated across heterogeneous task classes and architectures. The problem cell remains open: which synchronization policies minimize hallucination across heterogeneous task classes under communication constraints?

  ## Memory architecture incommensurability and the benchmark fragmentation problem

  The field has proposed three memory architectures for multi-agent LLM systems: shared-context designs where all agents access a common state repository; separate-context designs where each agent maintains its own memory; and hybrid designs combining elements of both. Each architecture carries intuitive merits and documented tradeoffs. Shared-context ensures tight coordination but risks consensus on error. Separate-context preserves agent autonomy and isolates contamination but permits context drift. Hybrids promise integration of both properties—or, in failure modes, inherit vulnerabilities from both.

  Yet the empirical evidence fragments across incommensurable evaluation regimes. Shared-context systems report faster convergence and tighter coordination on benchmarks designed around collaborative planning under time pressure, where rapid consensus is the measured success criterion. Separate-context systems report lower hallucination and higher fidelity on benchmarks emphasizing multi-hop reasoning and fact verification, where error detection across divergent agent histories is the success criterion. Hybrid systems report wins on communication overhead and latency reduction, measured on task distributions that prioritize efficiency (Yuen et al., 2025; Parakhin, 2026; Jain et al., 2026). The metrics themselves are not standardized: hallucination rate is operationalized differently across papers; long-horizon task performance uses different baseline definitions; communication efficiency is inconsistently reported. No head-to-head test under identical task conditions exists (Yuen et al., 2025; Parakhin, 2026; Jain et al., 2026).

  This is structural incommensurability, not minor methodological variance. When three competing memory architectures are evaluated on disjoint benchmark suites with task distributions fundamentally mismatched to each other, the field cannot determine whether architectural differences drive performance or whether benchmarks themselves favor one design's assumptions. No Pareto frontier can be computed. No practitioner recommendation can be justified. No property of memory architecture can be isolated as intrinsically superior versus task-contingent.

  The distinction matters for the focal question. Does shared state management reduce hallucination? The answer depends partly on which memory architecture implements it—yet the evidence does not compare them. Is dominance intrinsic (one memory architecture provably superior across all task classes) or task-dependent (each architecture optimal under different problem constraints)? If intrinsic, future deployed systems should converge on a single architecture. If task-dependent, multi-agent systems must select or compose architectures dynamically based on task properties. Current evidence rules out neither hypothesis and provides no guidance.

  The fragmentation prevents a second-order accumulation of knowledge. Proposals for improving memory architectures—hierarchical organization, compression schemes, poisoning detection—are evaluated within a single architecture's ecosystem, never compared across architectures. When hierarchical memory is proposed as an improvement to separate-context systems, it is tested only within separate-context; hybrid systems with flat memory topology are never compared against hybrid systems with hierarchy. This creates isolated optimization silos instead of evidence about which architectural properties matter independently of their hosting architecture.

  Until controlled experiments test all three memory architectures on identical tasks with identical metrics, the lattice cell addressing memory architecture remains blocked. The problem cell cannot be closed: every edge leading toward an answer to the focal question depends on resolving an architectural preference that current evidence does not support. Practitioners lack a basis to recommend an architecture. Researchers cannot identify which properties of memory architectures drive hallucination reduction or coordination maintenance.

  ## Hierarchical memory, long-horizon reasoning, and the fidelity-loss measurement gap

  The literature proposes that structured, hierarchical memory architectures—organizing agent knowledge into semantic hierarchies, temporal layers, or task-relevant abstractions—support longer-horizon reasoning better than flat retrieval (Rezazadeh et al., 2025). The intuition is sound: in flat memory, all facts compete equally for attention, and retrieving relevant context from thousands of items becomes computationally expensive and prone to noise. Hierarchical organization allows reasoning to operate at multiple abstraction levels, retrieving only relevant facts at each layer, and thus should maintain fidelity over extended horizons.

  Yet the empirical support for this claim remains observational, not quantitative. Papers report that hierarchical systems complete longer tasks or perform well on benchmarks; they do not measure the underlying mechanism. They do not quantify how much relevant context an agent loses as memory grows, or how long an agent's reasoning remains coherent under hierarchical versus flat retrieval. No direct measurement of fidelity loss or long-horizon task performance exists that isolates the architectural effect from confounding design choices.

  This gap reflects the distinction between claims and evidence. A claim has empirical support when you can measure its mechanism. Here, the mechanism—fidelity loss over reasoning length—is precisely what is unmeasured. You can observe that a hierarchical system performs well on a benchmark; you cannot determine whether it succeeds because hierarchical organization preserves relevant context and filters noise, or incidentally, because the design choices made for hierarchy also happen to reduce certain failure modes while flat memory with different design choices might succeed equally. Only a quantitative measurement of fidelity loss—how much information is lost in hierarchical compression, and how does it affect downstream reasoning accuracy—can distinguish these scenarios.

  The problem cell is therefore specific: what is the quantitative relationship between memory architecture (flat versus hierarchical), fidelity loss in summarization, and long-horizon reasoning performance? The pathway forward requires a controlled experiment where agents reason through trajectories of varying length; at each step, fidelity of retrieved context is measured relative to ground truth or to the agent's own prior reasoning; and fidelity loss is compared under hierarchical and flat memory architectures, controlling for retrieval speed, memory capacity, and semantic compression. Until such measurement closes the gap, hierarchical memory remains a plausible hypothesis unsupported by evidence of hallucination reduction or coordination maintenance—the outcomes that bear directly on the focal question. Practitioners may adopt hierarchical memory based on computational intuition, but researchers cannot yet identify whether memory architecture itself drives these coordination outcomes.

  ## Persistent memory and the information-integrity attack surface

  The continuity problem identified above—the measurement gap between memory architecture and hallucination reduction—is shadowed by a second-order failure mode: persistent cross-session memory creates an information-integrity attack surface. Institutional continuity requires that agents retain and reference decisions from prior sessions, accumulating institutional knowledge across time. Yet this persistence means that adversarially stored or corrupted content introduced in one session remains accessible to all agents in all future sessions (Louck, 2026; Tan et al., 2026; Meier et al., 2026). An agent downstream retrieves poisoned memory, incorporates it into reasoning, and propagates the contamination forward—not as a single-session error, but as a cascading, cross-domain failure that accrues over time and sessions.

  The threat model is concrete. Suppose an agent stores supply-chain analysis in persistent memory. An adversary later modifies the stored forecast with false demand signals. Weeks afterward, a different agent on a different team retrieves this poisoned memory, treats it as institutional knowledge, and produces hallucinated market conclusions on its basis. The attack succeeds through normal memory persistence, not through a security breach. This is qualitatively different from single-session hallucination: it is persistent, cross-domain, and designed to evade immediate detection.

  Governance regimes are proposed to mitigate this risk, each governing which candidate memories transition from private reasoning into shared institutional state. The spectrum spans ungoverned persistence (all content retained indefinitely), constitutional or hybrid selection (predefined rules determine retention), automatic metric-based selection (content scoring above a threshold persists), and human-ratified selection (humans approve transition to institutional memory) (Cuadros et al., 2026). These regimes apply across multiple memory layers with different stakeholders and persistence rules: agent-local memory (private to a single agent), shared institutional memory (accessible across agents in an organization), archive (long-term storage of deprecated or disputed content), and project-continuity memory (institutional knowledge spanning years and multiple projects). Operationalizing these regimes requires formalizing provenance and version lineage when agents, not humans, are the producers of memory. How does an agent mark its own memory as uncertain? How do multiple agents vote on persistence? What happens when provenance metadata itself is corrupted? These questions are identified; answers are not yet present.

  Security concerns intersect with proposed detection mechanisms for memory poisoning. Frequency-domain decomposition and entropy distribution analysis have been proposed to yield statistical signatures of adversarially crafted content (Tan et al., 2026; Meier et al., 2026). Unusual frequency or entropy properties could flag poisoned memories. But this proposal has not been validated against baseline or classical contamination-detection methods. The field does not know whether these signatures are robust, whether they produce false positives at acceptable rates, or whether they outperform simpler baselines—flagging content that contradicts prior institutional knowledge, for instance, or sourced from untrusted origins. This is the planted thread on detection validation: the proposed frequency-domain and entropy signatures remain unvalidated proposals, not yet evaluated against baseline methods.

  The problem cell spans governance design (which selection process preserves institutional memory faithfully?), attack modeling (what adversarial strategies bypass current or proposed detection?), and validation of detection mechanisms against realistic baselines. Until these gaps close, persistent memory remains a feature with unquantified security properties and unknown exposure to information-integrity degradation. Deployed systems will use persistent memory regardless—the operational benefit is too large to abandon—but they will do so with design choices made under uncertainty about the attack surface they create.

  ## Byzantine failure modes and the mapping from representation to distributed conditions

  In classical distributed systems, Byzantine failures are agent behaviors that deviate arbitrarily from specification—including corrupt state transmission, contradictory messaging to different peers, and false vote propagation—without necessarily triggering a crash. Byzantine fault-tolerance frameworks (PBFT, Raft with Byzantine extensions) guarantee correct operation even when a bounded fraction of agents are Byzantine. Multi-agent LLM systems exhibit failure modes distinguishable as Byzantine failure (Zheng et al., 2025; Rodrigues, 2026). Wrong-belief propagation under full-broadcast synchronization—where an agent holds a false belief and transmits it to all peers, who then propagate it further—is one such corruption event. Unlike a classical Byzantine attacker that might deliberately corrupt state, an LLM agent might hallucinate a false belief sincerely, then broadcast it. The effect on system behavior is identical: downstream agents receive and act on erroneous information, and the system fails to reach correct consensus. A poisoned persistent memory snapshot retrieved and propagated, or a corrupted state snapshot due to communication error, exhibits the same Byzantine profile: the agent produces output that is wrong and potentially adversarial in effect on coordination.

  Pilot experiments applying Byzantine fault-tolerance frameworks to multi-agent LLM systems report measurable reliability differences (Zheng et al., 2025; Rodrigues, 2026). Systems that implement Byzantine-resilient consensus—requiring supermajority agreement before accepting a new belief, or discarding shared state from agents with high disagreement history—exhibit lower hallucination rates and more stable coordination than systems without these safeguards. When redundant agents verify critical claims through independent reasoning paths, systems catch contradictions faster. These results suggest that tools developed for classical distributed systems can translate to LLM agent coordination, yet the translation is not straightforward.

  The mapping from representation-level properties to Byzantine conditions remains uncharacterized. In classical distributed systems, a Byzantine agent is defined operationally: an agent whose transmitted state violates the protocol, detectable via message signature or cryptographic hash. For LLM agents, the definition is opaque. What makes an agent Byzantine? Is it an agent that produces beliefs contradicting ground truth? An agent whose beliefs diverge from team consensus? An agent with high hallucination rate? The answer matters because Byzantine fault-tolerance thresholds depend on knowing how many agents can be Byzantine while maintaining correct operation. If 30% of agents can have transient hallucinations and the system remains safe, the design is robust; if 5% hallucination triggers cascading failure, fragility obtains. An LLM agent can be Byzantine—in the sense that its beliefs have diverged from correct coordination—but produces no cryptographic evidence of Byzantine status. Detecting Byzantine LLM agents requires reasoning about belief fidelity, not message authentication.

  Byzantine fault-tolerance theory operates on continuous-time trajectories of agent states and measures drift from intended paths. For LLM agents, the state is discrete: a knowledge-state snapshot of current beliefs, memories, and retrieved context. The question of distance between two snapshots—whether they are "similar" or "in agreement"—is not obvious. A snapshot is not a point in Euclidean space but a set of propositions, some hierarchically related, some uncertain. Measuring distance between snapshots requires defining a metric that respects this structure. Classical Lyapunov stability theory, which guarantees trajectories remain near equilibrium despite disturbances, assumes continuous dynamics and convex metric spaces. Stability for LLM reasoning has no clear definition. What would reasoning stability mean: consistency across multiple prompts, convergence to ground truth, insensitivity to perturbations? These are not trivial translation problems; they require reformulating distributed systems theory to respect the discrete, proposition-based, uncertain nature of LLM reasoning.

  The problem cell is clear: characterize Byzantine failure conditions for LLM agents such that classical Byzantine fault-tolerance thresholds can be computed. This requires defining when an agent state is "corrupt" (relative to what ground truth?), how to detect corruption with low false-positive rates, and how many corrupted agents the system can tolerate while maintaining correct coordination. Until these are defined, Byzantine fault-tolerance frameworks remain intuitive but not formally applicable to LLM systems.

  ## Classical multi-agent coordination and its potential transfer to LLM agents

  The distributed systems and control theory literature provides mathematically rigorous tools for coordination under communication constraints, time-varying topologies, and noisy state information. Event-triggered synchronization—where agents communicate only when state divergence exceeds a threshold rather than at fixed intervals—preserves system stability while reducing communication overhead (Nishida & Okano, 2026). The formal result holds across discrete and continuous time: under bounded divergence thresholds and sufficiently connected communication graphs, the system converges to consensus despite intermittent communication. This is established; Lyapunov stability proofs are constructive, and implementation guidance exists for both continuous and discrete-time systems.

  Finite- and fixed-time consensus protocols extend this foundation (Iqbal et al., 2022). These protocols guarantee that all agents reach agreement not asymptotically but within a finite number of steps or a fixed time horizon, operating on multi-agent systems with time-varying, switching, and intermittently connected directed topologies provided the topology remains jointly strongly connected. The techniques—homogeneity of vector fields, Lyapunov stability analysis, and graph-theoretic connectivity results—are mathematically mature and proven empirically on robot swarms, power grids, and sensor networks.

  For agents with constraints or subject to disturbances, consensus remains achievable through structured design (Krokavec & Filasová, 2026; Sun et al., 2025). Observer-type protocols handle linear agents with Metzler dynamics and time delay via linear matrix inequality optimization and diagonal stabilization. Sliding-surface reformulation with adaptive disturbance compensation guarantees full-state constraint satisfaction for second-order systems under switching directed graphs. These are deep results, proven rigorously and tested experimentally.

  The proposal is to transfer these results to LLM agents by substituting discrete knowledge-state snapshots for continuous trajectories. Instead of agents following continuous dynamics in position space, agents evolve in belief space. Instead of a continuous Lyapunov function measuring system energy, a discrete Lyapunov function would measure distance between agent knowledge states. Instead of consensus on a vector quantity (e.g., "agree on position x"), agents would reach consensus on a propositional quantity (e.g., "agree on whether the flight departs at 3 PM").

  This transfer is structurally sound: both classical coordination and LLM agent coordination involve multiple autonomous agents with local information trying to reach agreement, face communication constraints, and must handle partial information and noise. The correspondence suggests the transfer may succeed. Yet it has not been validated. The transfer requires formalizing three objects that classical theory takes as given.

  First, the distance metric for knowledge states. Classical theory uses Euclidean distance: ||x₁ − x₂||. For LLM agent beliefs, distance could be semantic similarity, count of contradictions, or entropy of disagreement. Which metric preserves the stability properties that classical analysis depends on? Second, stability metrics for LLM reasoning. A Lyapunov-like function for reasoning would measure a quantity that decreases over reasoning steps when agents are correctly coordinated and increases when they diverge. This function must be measurable from agent outputs (beliefs, reasoning traces) and must have mathematical properties guaranteeing convergence. Third, disturbance models for hallucination. In control theory, disturbances are bounded random processes with known statistics. For LLM agents, what are the statistics of hallucination in multi-agent settings? How do hallucinations propagate between agents and affect consensus?

  Without these formalizations, classical results are analogies, not theorems. They provide conceptual tools—threshold-based triggering, graph-based connectivity requirements, Lyapunov bounds—but their instantiation in LLM settings remains speculative. Event-triggered synchronization comes closest to intuitive applicability: rather than all agents synchronizing at every step, each agent triggers synchronization protocol activation when detecting context drift from its neighbors. Yet this assumes you can reliably detect context drift in belief space, a non-trivial problem when divergence is a structural mismatch between knowledge representations rather than a scalar distance.

  The classical literature does not formalize these transfers; it postulates them. A complete transfer would require explicit formal definition of when two agent knowledge states are close enough for classical stability theorems to apply, measurement of Lyapunov-like quantities from agent outputs, and a formal model of how hallucination enters, propagates, and affects consensus—each validated through empirical testing. The transfer conditions are unvalidated.

  ## Memory efficiency, edge deployment, and resource-constrained coordination

  Multi-agent LLM systems deployed on edge devices—embedded systems, mobile platforms, local servers without unlimited cloud GPU capacity—operate under hard memory constraints. A single agent with a long context window consumes thousands of GPU tokens; multiple agents with overlapping contexts rapidly exhaust available memory, forcing tradeoffs between agent count and history window length. Shorter histories increase hallucination (agents forget prior decisions) and coordination failures (agents cannot access shared decisions from prior sessions). This constraint is distinct from but orthogonal to the core hallucination and synchronization problems established earlier: a system that reduces API calls through selective synchronization but runs on a single large GPU solves a different bottleneck than a system that achieves memory reduction through compression but still over-communicates.

  Context-adaptive KV-cache compression addresses the memory bottleneck by dynamically quantizing and pruning low-usage key-value pairs in transformer attention (Mohammed et al., 2025). Combined with meta-learned sparse attention patterns that learn which attention heads are essential for each task, this approach achieves 40% memory reduction and 20% inference speed improvement while maintaining over 95% baseline accuracy on LongBench and multi-agent benchmarks (Mohammed et al., 2025). Under tight GPU budgets, this compression enables more agents to run concurrently or longer history windows to be maintained, reducing pressure on hallucination through shorter histories.

  Yet memory efficiency does not directly address shared state coherence. An efficient shared state that is wrong is still wrong; compressing KV caches reduces memory footprint but does not resolve context drift, synchronization protocol design, or the memory architecture choices that determine how agents access and verify state. Compression may even degrade coordination if it discards context needed to detect divergence or resolve disputes between agents.

  The interaction between memory efficiency and synchronization protocol design remains unexplored. If agents must compress their state representations to fit in GPU memory, does this compression affect how divergence is detected? If selective summary-based synchronization works by exchanging compressed state summaries, does KV-cache compression—which prunes low-usage information—degrade divergence detection by removing the very information needed to identify misalignment? Would Byzantine-resilient protocols tolerate the noise and loss introduced by aggressive quantization, or would they require higher redundancy, defeating the efficiency gain? These questions remain unaddressed because the literature has not integrated efficiency innovations with coordination protocols.

  For practical deployment, resource constraints are a real condition on the focal question: under what conditions does shared state management reduce hallucination while maintaining coordination? Current protocol evaluation typically assumes unconstrained systems; efficiency innovations typically assume single-agent or homogeneous scenarios. Protocol selection cannot be decoupled from memory footprint, latency, communication overhead, and scaling behavior under memory constraint. Bridging this gap—establishing which synchronization protocols and memory-efficiency techniques together preserve coordination fidelity—is a prerequisite for deployment guidance. The specific typed gap is: what interaction patterns between KV-cache compression and event-triggered synchronization preserve both memory bounds and divergence detection accuracy?

  ## Open questions and future directions

  The problem-lattice framework organizes the field into interlocking open questions, each of which must be resolved for deployed systems to reliably reduce hallucination and maintain coordination. The focal question—under what conditions does shared state management reduce hallucination while maintaining coordination?—remains unanswered because the evidence base is fragmented across incomparable benchmarks, weak empirical support for emerging claims, and unvalidated transfers of classical theory. Five priority problems emerge from this review, each addressing a structural block in the current evidence.

  **Problem 1: Settle architectural dominance or reveal task-dependence.** Design a controlled experiment testing all three memory architectures (shared-context, separate-context, hybrid) on identical task suites with identical evaluation metrics (Yuen et al., 2025; Parakhin, 2026; Jain et al., 2026). The experiment must span problem classes: tightly coupled reasoning (e.g., debate or collaborative planning), loosely coupled exploration (e.g., parallel search), and mixed tasks with phases of both. For each task class, measure hallucination rate, coordination latency, communication overhead, and accuracy on downstream reasoning. This directly cashes in the planted thread on benchmark fragmentation: no head-to-head test under identical task conditions exists. Resolution requires a multi-site, well-resourced empirical study. Expected outcome: either one architecture dominates (simplifying future deployment), or performance is task-dependent (requiring dynamic architecture selection based on task properties).

  **Problem 2: Validate transfer of classical consensus and event-triggered synchronization to LLM agents.** Formalize the discrete analogues of continuous multi-agent control concepts. This requires three sub-problems: (a) Define a distance metric between agent knowledge states such that classical stability theorems apply, respecting the structure of beliefs, hierarchies, and dependencies. (b) Define stability criteria for LLM reasoning—what does it mean for reasoning to remain stable when perturbed by hallucination or noise? Construct a Lyapunov-like function measurable from agent outputs that captures coordination fidelity. (c) Model hallucination as a bounded disturbance process and characterize under what conditions consensus protocols remain stable despite it. (d) Implement event-triggered synchronization with mathematically grounded threshold selection and test on multi-agent reasoning tasks, comparing to fixed-interval synchronization. This cashes in the planted thread on control-theory transfer: discrete knowledge-state snapshots replacing continuous trajectory analysis. Expected outcome: either the transfer holds under explicit conditions (enabling use of classical tools for LLM agent design), or the transfer fails, requiring LLM-specific coordination theory.

  **Problem 3: Measure long-horizon fidelity loss under hierarchical vs. flat memory.** Close the measurement gap in hierarchical memory claims (Rezazadeh et al., 2025). Design a controlled experiment where agents reason over extended task horizons (10 steps, 50 steps, 500 steps) using either hierarchical or flat memory retrieval. At each step, measure (a) whether agents retrieve relevant prior decisions, (b) whether hierarchical compression loses information critical for downstream reasoning, and (c) accuracy on downstream reasoning steps given compressed versus uncompressed history, controlling for other variables. Expected outcome: quantify the information-fidelity tradeoff for hierarchical organization, establish whether the benefits exceed the costs for long-horizon coordination, and document under what task conditions the advantage appears and disappears.

  **Problem 4: Validate memory-poisoning detection mechanisms and design scalable governance.** Run comparative evaluation of proposed frequency-domain and entropy-based detection mechanisms (Tan et al., 2026; Meier et al., 2026) against established baselines: (a) consistency checking (flagging memories contradicting prior institutional knowledge), (b) source-based filtering (discarding memories from untrusted sources), and (c) majority vote (accepting memories only if multiple agents independently produce the same shared state). Test detection performance on synthetic poisoned memories, real corrupted memories from deployed systems if available, and benign memories to measure false-positive rates. Additionally, design governance regimes spanning ungoverned, constitutional, metric-based, and human-ratified selection that scale to multi-year project continuity. Specify decision points, required information, human oversight models, and version-lineage management. Pilot these regimes in deployed systems and measure their burden on human operators and their effect on system reliability. Expected outcome: identify which detection mechanisms outperform baselines and which governance regimes preserve institutional memory fidelity under adversarial and benign threats.

  **Problem 5: Characterize Byzantine failure conditions in LLM agents.** When does agent disagreement indicate Byzantine failure versus legitimate uncertainty? Design experiments in which agents are exposed to controlled Byzantine errors (injected false beliefs, corrupted memories, misleading context). Define operationally when an LLM agent should be considered Byzantine: (a) define "corruption" in terms of belief divergence relative to ground truth or team consensus; (b) develop detection mechanisms with quantified false-positive rates for identifying corrupted agents; (c) compute Byzantine fault-tolerance thresholds—how many agents can hallucinate or hold stale beliefs while the system remains coordinated? (d) Apply Byzantine-resilient consensus protocols (supermajority voting, outlier rejection) and measure reliability gains over non-resilient baselines. Document the conditions under which Byzantine theory predictions hold and where LLM agents deviate.

  Concrete next steps for the community bridge the research-deployment gap. Establish a shared benchmark suite for multi-agent LLM coordination with task distributions spanning short-horizon consensus, long-horizon reasoning, adversarial inputs, and resource-constrained settings, publishing results from all three memory architectures on this suite. Organize working groups at major venues (ACL, IJCAI, NeurIPS) to formalize the control-theoretic transfer and pilot implementations. Allocate resources for longitudinal governance studies where multi-agent systems operate over months and years, generating real institutional memory and revealing failure modes undetectable in short-horizon experiments. Establish security-focused benchmarks for information-integrity attack surface characterization and Byzantine failures, with evaluation protocols, baselines, and metrics agreed upon by the community before systems are tested. These gaps cannot be closed by LLM researchers alone; the architectural evaluation requires benchmark engineering and new metrics; the control-theory transfer requires mathematicians and control theorists collaborating with LLM researchers; the fidelity measurement requires careful experimental design; security evaluation requires information-security expertise; and Byzantine characterization requires distributed systems theory.

  ## Conclusion

  Multi-agent LLM systems face hallucination and coordination failures rooted in shared state divergence. The field's current literature does not present resolved answers but rather a lattice of interlocking open problems: context drift and synchronization tradeoffs; memory architectural incommensurability across incompatible benchmarks; emerging but unvalidated claims about hierarchical memory, information-integrity vulnerabilities, and Byzantine failures; and control-theoretic results from classical multi-agent systems whose transfer to LLM agents is postulated but not demonstrated.

  Context drift is a real and distinct source of hallucination (Rodrigues, 2026). Naive full-broadcast synchronization worsens it by propagating erroneous states (Rodrigues, 2026). Selective summary-based synchronization shows promise but is validated on a single benchmark (Rodrigues, 2026). Without a controlled comparison across memory architectures on identical tasks, the core empirical question remains open: which architecture—shared-context, separate-context, or hybrid—reduces hallucination while maintaining coordination? No head-to-head test under identical task conditions exists (Yuen et al., 2025; Parakhin, 2026; Jain et al., 2026).

  Hierarchical memory is claimed to support longer-horizon reasoning, but support is observational, not quantitative (Rezazadeh et al., 2025). Persistent memory creates information-integrity attack surfaces, and proposed governance regimes span a spectrum of security-scalability tradeoffs, but none is validated (Louck, 2026; Tan et al., 2026; Meier et al., 2026; Cuadros et al., 2026). Memory-poisoning detection mechanisms are proposed without comparison to baselines (Tan et al., 2026; Meier et al., 2026). Byzantine failure modes in LLM agents are recognized as distinct from classical failures, and pilot experiments suggest Byzantine fault-tolerance frameworks are relevant (Zheng et al., 2025; Rodrigues, 2026), but the mapping from representation-level properties to Byzantine conditions remains uncharacterized.

  Classical multi-agent control theory offers rigorous solutions for consensus, event-triggered synchronization, and handling constrained and disturbance-prone agents (Nishida & Okano, 2026; Iqbal et al., 2022). These results are mathematically complete for continuous multi-agent systems, but their transfer to LLM agents requires formalizing how discrete knowledge-state snapshots replace continuous trajectory analysis. This translation work has not been done. Context-adaptive memory compression improves resource efficiency under edge constraints (Mohammed et al., 2025), but the interaction between memory efficiency and synchronization protocol design is unexplored.

  The field's empirical situation is decisive: no single coordination approach dominates; architectural choice is consequential but incommensurable; emerging frameworks (Byzantine failures, classical control transfer, persistent-memory governance) lack empirical validation; and resource constraints create additional tradeoffs that are not yet characterized. Current evidence is too fragmented and weakly supported to recommend a dominant memory architecture or synchronization protocol.

  Future work must move from isolated benchmarking to controlled comparisons. The priority is designing a single experimental regime that tests all memory architectures on identical tasks with identical metrics, settling architectural dominance or revealing its task-dependence. In parallel, validating the transfer of classical control-theoretic results to LLM agents requires formalizing knowledge-state distance, stability metrics for reasoning, and bounds on hallucination-as-disturbance. Closing the fidelity-loss measurement gap in hierarchical memory requires quantitative long-horizon benchmarks. Advancing security requires comparing poisoning-detection mechanisms to established baselines and designing governance regimes that scale beyond single-project timescales. Characterizing Byzantine failures in LLM agents requires formal definitions distinguishing Byzantine corruption from legitimate uncertainty and determining protocol-specific fault-tolerance bounds.

  These are not minor incremental refinements. They are prerequisite to building reliable multi-agent LLM systems at scale, especially under resource or security constraints. The field's current state is diagnosis of the problem, not solution. The problems are real and correctly identified by the literature. But the evidence required to solve them—controlled experiments, comparative validation, quantitative measurement, formal characterization—has not yet been gathered. This review is not a summary of settled knowledge; it is a diagnosis of why the problem remains open and a prescription for the evidence required to close the gaps.

